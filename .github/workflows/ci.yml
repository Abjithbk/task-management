name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: FRONTEND (React + pnpm)
  # ==========================================
  frontend:
    name: Frontend (React/pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 1: Install pnpm FIRST
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # Match this to your local 'pnpm --version'

      # STEP 2: Setup Node.js SECOND (Now it can safely find pnpm to set up the cache)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm build 

      - name: Run Tests
        run: pnpm test 

  # ==========================================
  # JOB 2: BACKEND (Python + FastAPI)
  # ==========================================
  backend:
    name: Backend (Python/FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx 

      # LINT STEP REMOVED

      - name: Run Tests
        run: pytest 